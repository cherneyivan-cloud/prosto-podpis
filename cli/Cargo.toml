[package]
name = "cryptoline-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
# ASN.1 / DER / X.509
der = "0.7"
x509-cert = "0.2"

# ГОСТ Р 34.11-2012 (Стрибог)
streebog = "0.11"
digest = "0.11"

# SHA-256 для RFC 6979
sha2 = "0.10"

# Большая арифметика для EC-математики ГОСТ Р 34.10-2012
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

# Кодирование
base64 = "0.22"

# Утилиты
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI для Wave 3
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
hex = "0.4"

[[bin]]
name = "Podpis-cli"
path = "src/main.rs"
