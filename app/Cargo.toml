[package]
name = "cryptoline-standalone"
version = "1.2.4"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "Podpis"
path = "src/main.rs"

[dependencies]
egui = "0.27"
eframe = "0.27"
rfd = "0.14"  # Диалоги файлов
raw-window-handle = "0.6"  # HWND окна для Win32-хелперов

# Криптография
sha2 = "0.10"

# Утилиты
zip = "0.6"
chrono = "0.4"
base64 = "0.22"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
