[package]
name = "cryptoline-standalone"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "Podpis"
path = "src/main.rs"

[dependencies]
# GUI
egui = "0.27"
eframe = "0.27"
rfd = "0.14"  # Диалоги файлов
raw-window-handle = "0.6"  # HWND окна для Win32-хелперов

# Криптография
sha2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"

# Утилиты
zip = "0.6"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
tokio = { version = "1.0", features = ["full"] }

# Windows API
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
